<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costantino Artist Studio</title>
  <meta name="description" content="Costantino Artist Studio. The family of artists. Make a Mess and Fix It.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c1712;
      --ink: #f4ebe0;
      --muted: #c4b6a4;
      --line: rgba(244, 235, 224, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100%;
      background:
        radial-gradient(1200px 700px at 50% 0%, #2a221b 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      text-align: center;
      padding: 3rem 1.5rem 4rem;
    }
    main { max-width: 40rem; margin: 0 auto; }
    p.kicker {
      margin: 0 0 1.1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
    }
    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.4rem, 8vw, 4.1rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: 0.01em;
    }
    p.tagline {
      margin: 1.35rem 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.15rem, 3.4vw, 1.45rem);
      font-style: italic;
      font-weight: 500;
      color: var(--ink);
    }
    hr {
      width: 3.5rem;
      border: 0;
      border-top: 1px solid var(--line);
      margin: 2rem auto;
    }
    .works {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 2.4rem;
    }
    figure { margin: 0; }
    figure img {
      width: 100%;
      height: auto;
      display: block;
    }
    figure.portrait { max-width: 22rem; margin: 0 auto; }
    figcaption {
      margin: 0.7rem 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      font-weight: 500;
      color: var(--muted);
    }
    a.inquire {
      display: inline-block;
      margin: 0;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 300;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.15rem;
    }
    a.inquire:hover { border-bottom-color: var(--ink); }
    p.place {
      margin: 1.6rem 0 0;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    p.gallery {
      margin: 0.45rem 0 0;
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">The family of artists</p>
    <h1>Costantino Artist Studio</h1>
    <p class="tagline">Make a Mess and Fix It</p>
    <hr>
    <div class="works">
      <figure class="portrait">
        <img src="works/great-blue-in-flight.jpg" alt="Great Blue In Flight, a heron over water">
        <figcaption>Great Blue In Flight</figcaption>
      </figure>
      <figure>
        <img src="works/hippie-fish.jpg" alt="Hippie Fish, a vivid abstract fish">
        <figcaption>Hippie Fish</figcaption>
      </figure>
    </div>
    <hr>
    <a class="inquire" href="mailto:stephltino@gmail.com">Inquire</a>
    <p class="place">Saint Augustine, Florida</p>
    <p class="gallery">Hebron Gallery</p>
  </main>
</body>
</html>
